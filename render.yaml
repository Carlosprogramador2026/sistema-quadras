services:
  - type: web
    name: quadra-backend
    runtime: node
    plan: free
    rootDir: quadraja-main/backend
    buildCommand: npm install && npx prisma migrate deploy && node prisma/seed.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GESTOR_WHATSAPP
        value: "5511999998888"
      - key: CORS_ORIGIN
        sync: false
